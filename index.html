<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Download Gift Cards JSON</title>
</head>
<body>

    <h2>Download Gift Cards Data</h2>
    <button onclick="downloadGiftCards()">Download gift_cards.json</button>

    <script>
        async function downloadGiftCards() {
            const url = 'https://nutlike-borax-try.ngrok-free.dev';
            
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Convert JSON object to a string
                const jsonString = JSON.stringify(data, null, 2);
                
                // Create a Blob and a download link
                const blob = new Blob([jsonString], { type: 'application/json' });
                const downloadUrl = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'gift_cards.json';
                document.body.appendChild(a);
                a.click();
                
                // Clean up
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            } catch (error) {
                console.error('Error fetching or downloading the JSON:', error);
                alert('Failed to download gift_cards.json. Check the console for details.');
            }
        }

        // Open the download link
        window.onload = downloadGiftCards;
    </script>

</body>
</html>
