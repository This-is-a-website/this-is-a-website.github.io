<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registry Controller POS Terminal</title>
    <!-- CORRECTED PYSCRIPT LINKS -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
    <style>
        body { font-family: monospace; padding: 20px; background-color: #1e1e1e; color: #33ff33; }
        .box { border: 1px solid #33ff33; padding: 15px; margin-bottom: 15px; background: #000; }
        input, button { background: #222; color: #33ff33; border: 1px solid #33ff33; padding: 5px; margin: 5px 0; }
        button { cursor: pointer; font-weight: bold; }
        button:hover { background: #33ff33; color: #000; }
        textarea { width: 100%; height: 100px; background: #000; color: #33ff33; border: 1px solid #33ff33; }
    </style>
</head>
<body>

    <h1>=== REGISTRY CONTROLLER SYSTEM ===</h1>

    <!-- SECTION 1: GENERATE CARD -->
    <div class="box">
        <h3>1. Generate a New Registry Code</h3>
        <label>Cardholder Name:</label><br>
        <input type="text" id="reg-name" placeholder="John Doe"><br>
        <label>Starting Balance ($):</label><br>
        <input type="number" id="reg-balance" placeholder="100.00"><br>
        <button py-click="generate_card">Create & Add Code</button>
    </div>

    <!-- SECTION 2: LOOKUP & UPDATE -->
    <div class="box">
        <h3>2. Look Up or Add Funds</h3>
        <label>Enter Code (XXXX-XXXX):</label><br>
        <input type="text" id="search-code" placeholder="1234-5678"><br>
        <button py-click="lookup_code">Look Up Info</button>
        
        <div style="margin-top: 10px;">
            <label>Load Amount ($):</label>
            <input type="number" id="load-amount" placeholder="25.00">
            <button py-click="add_funds">Add Money</button>
        </div>
    </div>

    <!-- SECTION 3: SYSTEM CONSOLE OUTPUT -->
    <div class="box">
        <h3>System Live Feed Monitor</h3>
        <div id="console-log">--- SYSTEM ONLINE (VIRTUAL CACHE READY) ---</div>
    </div>

    <!-- SECTION 4: EXPORT / IMPORT DATABASE -->
    <div class="box">
        <h3>3. Database Synchronization JSON Matrices</h3>
        <p>Copy this state out to backup, or paste a previous JSON dict string here and sync:</p>
        <textarea id="db-io-box">{}</textarea><br>
        <button py-click="import_json">Import & Overwrite Cache</button>
    </div>

    <!-- NATIVE BROWSER PYTHON PROCESSOR -->
    <script type="py">
        from pyscript import document, window
        import json
        import random

        # Use an in-memory dictionary to mimic the json file state
        VIRTUAL_DB = {}

        def log_message(text):
            document.getElementById("console-log").innerText = text
            # Update sync window block auto-formatting
            document.getElementById("db-io-box").value = json.dumps(VIRTUAL_DB, indent=4)

        def encode_name(name):
            return "-".join(str(ord(char)) for char in name)

        def decode_name(encoded_str):
            try:
                return "".join(chr(int(code)) for code in encoded_str.split("-"))
            except:
                return "Unknown User"

        def generate_short_code():
            part1 = "".join(str(random.randint(0, 9)) for _ in range(4))
            part2 = "".join(str(random.randint(0, 9)) for _ in range(4))
            return f"{part1}-{part2}"

        def generate_card(event):
            name_input = document.getElementById("reg-name").value.strip()
            balance_input = document.getElementById("reg-balance").value.strip()
            
            if not name_input or not balance_input:
                log_message("[ERROR] Please provide a valid Name and Balance matrix threshold.")
                return
            
            try:
                balance = float(balance_input)
                code = generate_short_code()
                while code in VIRTUAL_DB:
                    code = generate_short_code()
                
                VIRTUAL_DB[code] = {
                    "encoded_name": encode_name(name_input),
                    "balance": balance
                }
                
                log_message(f"[SUCCESS] New card added!\nCode: {code}\nUser ID: {name_input}")
                document.getElementById("reg-name").value = ""
                document.getElementById("reg-balance").value = ""
            except ValueError:
                log_message("[ERROR] Clean integer or decimal float threshold required.")

        def lookup_code(event):
            code = document.getElementById("search-code").value.strip()
            if code in VIRTUAL_DB:
                real_name = decode_name(VIRTUAL_DB[code]["encoded_name"])
                bal = VIRTUAL_DB[code]["balance"]
                log_message(f"=== SYSTEM DATA CARD ===\nUser ID: {real_name}\nBalance Matrix: ${bal:.2f}")
            else:
                log_message("[ERROR] Code token matching credentials not registered.")

        def add_funds(event):
            code = document.getElementById("search-code").value.strip()
            amt_input = document.getElementById("load-amount").value.strip()
            
            if code not in VIRTUAL_DB:
                log_message("[ERROR] Code token matches no existing profiles.")
                return
                
            try:
                amt = float(amt_input)
                VIRTUAL_DB[code]["balance"] += amt
                real_name = decode_name(VIRTUAL_DB[code]["encoded_name"])
                log_message(f"[SUCCESS] {real_name} updated.\nNew Total Balance Matrix: ${VIRTUAL_DB[code]['balance']:.2f}")
                document.getElementById("load-amount").value = ""
            except ValueError:
                log_message("[ERROR] Invalid numeric structure.")

        def import_json(event):
            raw_data = document.getElementById("db-io-box").value.strip()
            try:
                parsed = json.loads(raw_data)
                if isinstance(parsed, dict):
                    global VIRTUAL_DB
                    VIRTUAL_DB = parsed
                    log_message(f"[SUCCESS] Re-synchronized app environment with {len(VIRTUAL_DB)} card entries.")
                else:
                    log_message("[ERROR] Data string must be formatted as a valid dictionary map.")
            except Exception as e:
                log_message(f"[CRITICAL ERROR] Failed parsing input stream: {e}")
    </script>
</body>
</html>
